[package]
name = "nocturnal"
version = "1.0.0"
edition = "2021"
description = "Keeps a laptop awake with the lid closed while AI agents work, then lets it sleep. Windows and Linux edition."
license = "MIT"

[[bin]]
name = "nocturnal"          # command line + MCP server (console)
path = "src/bin/cli.rs"

[[bin]]
name = "nocturnal-app"      # tray app (no console window on Windows)
path = "src/bin/app.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-rust = "4"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
tray-icon = "0.26"
tao = "0.37"
aes-gcm = "0.10"
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Power",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemServices",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_System_Time",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_Devices_Display",
] }

[profile.release]
panic = "abort"   # a panic anywhere ends the process: the OS drops the keep-awake lock, the watchdog cleans up
opt-level = "s"
lto = true
strip = true
