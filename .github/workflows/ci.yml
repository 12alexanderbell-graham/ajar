name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: windows-linux } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with: { components: clippy }
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo test --lib
      - run: cargo clippy --all-targets -- -D warnings
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: windows-linux } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
      - run: cargo test --lib
      - run: cargo build --release
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build (universal, unsigned)
        working-directory: mac
        run: xcodebuild -project Nocturnal.xcodeproj -scheme Nocturnal -configuration Release -destination 'generic/platform=macOS' ONLY_ACTIVE_ARCH=NO ARCHS="arm64 x86_64" CODE_SIGN_IDENTITY=- -derivedDataPath build build
      - name: Zip the app (ad-hoc signed, same as install.sh makes)
        working-directory: mac
        run: |
          codesign --verify --deep --strict build/Build/Products/Release/Nocturnal.app
          ditto -c -k --keepParent build/Build/Products/Release/Nocturnal.app Nocturnal-mac.zip
          shasum -a 256 Nocturnal-mac.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac
          path: mac/Nocturnal-mac.zip
