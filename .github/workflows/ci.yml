name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: windows-linux } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with: { components: clippy }
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - run: cargo test --lib
      - run: cargo clippy --all-targets -- -D warnings
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: windows-linux } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - run: cargo test --lib
      - run: cargo build --release
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Build (universal, unsigned)
        working-directory: mac
        run: xcodebuild -project Ajar.xcodeproj -scheme Ajar -configuration Release -destination 'generic/platform=macOS' ONLY_ACTIVE_ARCH=NO ARCHS="arm64 x86_64" CODE_SIGN_IDENTITY=- build
