name: Release
# Publish a release on GitHub with a new tag like v1.0.1 (Releases › Draft a new release), or push such a tag:
# GitHub builds every download from that tag's source and attaches them to the release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows-linux:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: windows-linux } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with: { targets: x86_64-pc-windows-gnu }
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev mingw-w64 zip
      - run: pip install ziglang && cargo install cargo-zigbuild --locked
      - run: sh packaging/build-dist.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-linux
          path: |
            windows-linux/dist/*.zip
            windows-linux/dist/*.tar.gz
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - working-directory: mac
        run: |
          xcodebuild -project Ajar.xcodeproj -scheme Ajar -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build ONLY_ACTIVE_ARCH=NO ARCHS="arm64 x86_64" CODE_SIGN_IDENTITY=- build
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/Nocturnal.app "Nocturnal-${GITHUB_REF_NAME#v}-mac.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: mac, path: mac/*.zip }
  release:
    needs: [windows-linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: out, merge-multiple: true }
      - run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Created by hand on github.com: attach the builds to it.
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" out/*
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "Nocturnal ${GITHUB_REF_NAME#v}" \
              --notes "Built by GitHub Actions from this tag's source. macOS 14+ (universal), Windows 10/11 and Linux with systemd (x86-64). Checksums in SHA256SUMS." out/*
          fi
