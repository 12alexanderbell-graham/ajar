name: Release
# Publish a release on GitHub with a new tag like v1.0.1 (Releases › Draft a new release), or push such a tag:
# GitHub builds the Windows and Linux downloads from that tag's source and attaches them to the release. The Mac app
# is signed and notarized on a Mac with mac/release.sh (it needs your Developer ID), then uploaded by hand.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows-linux:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: windows-linux } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with: { targets: x86_64-pc-windows-gnu }
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev mingw-w64 zip
      - run: pip install ziglang && cargo install cargo-zigbuild --locked
      - run: sh packaging/build-dist.sh
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-linux
          path: |
            windows-linux/dist/*.zip
            windows-linux/dist/*.tar.gz
  versions:
    # The tag, the Windows/Linux version and the Mac version must agree, or the downloads get mismatched names.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(grep '^version' windows-linux/Cargo.toml | head -1 | cut -d'"' -f2)
          mac=$(grep -m1 'MARKETING_VERSION' mac/Nocturnal.xcodeproj/project.pbxproj | sed 's/.*= *\([^;]*\);.*/\1/')
          echo "tag $tag · windows-linux $cargo · mac $mac"
          [ "$tag" = "$cargo" ] && [ "$tag" = "$mac" ] || { echo "Versions differ: bump Cargo.toml and MARKETING_VERSION to $tag"; exit 1; }
  release:
    needs: [versions, windows-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with: { path: out, merge-multiple: true }
      - run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Created by hand on github.com: attach the builds to it.
            gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" out/*
          else
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "Nocturnal ${GITHUB_REF_NAME#v}" \
              --notes "Windows 10/11 and Linux with systemd (x86-64), built by GitHub Actions from this tag's source; checksums in SHA256SUMS. The Mac app (macOS 14+, signed and notarized) is at https://nocturnal.tools and via Homebrew: brew install --cask 12alexanderbell-graham/nocturnal/nocturnal" out/*
          fi
